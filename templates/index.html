<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{site_title}</title>
    <meta name="description" content="{site_description}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .header {
            background: #2385bb;
            color: white;
            padding: 60px 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .header p {
            font-size: 20px;
            opacity: 0.9;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .intro {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid #eee;
        }
        .intro h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #333;
        }
        .intro p {
            font-size: 18px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 15px;
        }
        .contact {
            font-size: 18px;
            color: #2385bb;
            font-weight: bold;
        }
        .posts h3 {
            font-size: 24px;
            margin-bottom: 30px;
            color: #333;
        }
        .post-item {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid #eee;
        }
        .post-item h4 {
            font-size: 22px;
            margin-bottom: 10px;
        }
        .post-item h4 a {
            color: #2385bb;
            text-decoration: none;
        }
        .post-item h4 a:hover {
            text-decoration: underline;
        }
        .post-date {
            font-size: 14px;
            color: #999;
            margin-bottom: 15px;
        }
        .post-excerpt {
            font-size: 16px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 15px;
        }
        .read-more {
            font-size: 16px;
            color: #2385bb;
            text-decoration: none;
        }
        .read-more:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>{site_title}</h1>
        <p>{site_description}</p>
    </div>

    <div class="container">
        <div class="intro">
            <h2>欢迎来到{site_title}</h2>
            <p>专注AI+SEO+GEO全域获客，帮助企业建立持续、稳定、低成本的自然流量获客能力。</p>
            <p class="contact">{contact}</p>
        </div>

        <div class="posts">
            <h3>最新文章</h3>
            {posts}
        </div>

        {pagination}
    </div>
</body>
</html>
